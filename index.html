<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tekstura stroji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday-trade: serious B2B dealer of Italian machinery, calm and exact
   IDEA a machine-dealer catalogue: ruled rows with codes, manufacturer and machine type, like a printed price list
   PICTURE an illustrated double-head saw cutting an aluminium profile on a deep green band
   COLOUR deep FOM-like green ground for header and hero, white pages, lime-white accent on green, green buttons on white
   TYPE Archivo 800 for headings and model names + Inter for text
   LAYOUT laptop: top bar with languages and login, nav, hero band, then each tab; phone: stacked, nav wraps */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1513);--ink:light-dark(#14201c,#e9f0ec);--mut:light-dark(#56645e,#a2b1aa);--line:light-dark(#dbe3df,#26332e);--panel:light-dark(#f1f5f3,#16201c);--g:#0b3d2f;--g2:#0f4d3b;--lime:#d6f06a;--btn:light-dark(#0b3d2f,#2f8a6b);--warn:light-dark(#9a3412,#fb9a6c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.logo{font-family:Archivo,Inter,sans-serif;letter-spacing:-.02em;line-height:1.05;margin:0}
h1{font-size:clamp(32px,5vw,50px);font-weight:800;text-wrap:balance}
h2{font-size:clamp(26px,3.4vw,38px);font-weight:800;text-wrap:balance}
h3{font-size:20px;font-weight:700}
a{color:inherit}
.band{padding:clamp(28px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
.test{background:#7c2d12;color:#fff;font-size:13px;text-align:center;padding:5px 16px}
.top{background:#072a20;color:#cfe1d8;font-size:14px}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px max(5vw,16px);flex-wrap:wrap;max-width:none}
.langs{display:flex;gap:2px}
.langs button,.acct button{background:none;border:0;color:#cfe1d8;font:600 14px Inter,sans-serif;padding:8px 9px;cursor:pointer;border-radius:4px;min-height:36px}
.langs button[aria-pressed=true]{background:var(--lime);color:#072a20}
.acct{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.acct b{color:#fff;font-weight:600}
header{position:sticky;top:0;z-index:20;background:var(--g);color:#fff}
#katalog{scroll-margin-top:84px}@media(max-width:1180px){#katalog{scroll-margin-top:130px}}
.hd{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px max(5vw,16px);flex-wrap:wrap}
.logo{font-size:24px;font-weight:800;text-decoration:none;color:#fff}
.logo span{color:var(--lime);font-weight:500;font-size:14px;margin-left:6px;letter-spacing:0}
nav{display:flex;gap:0;flex-wrap:nowrap;flex:1;justify-content:center;min-width:0}
nav a{color:#d9e8e1;text-decoration:none;padding:10px 8px;border-radius:6px;font-size:15px;white-space:nowrap;flex-shrink:0}
#fBrand.bch{flex-direction:column;align-items:stretch}#fBrand.bch .chip{text-align:left;border-radius:8px}
.nvw{display:flex;align-items:center;flex-shrink:0}.nvw>a{padding-right:2px}
.nvt{background:none;border:0;color:#d9e8e1;cursor:pointer;padding:10px 6px;border-radius:6px;font-size:12px;min-height:40px}.nvt:hover,.nvt:focus-visible,.nvt[aria-expanded=true]{background:var(--g2);color:#fff}
.sub{position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;min-width:280px;display:none}
.sub.on{display:block}.sub a{display:block;color:var(--ink);text-decoration:none;padding:10px 12px;border-radius:6px;font-size:15px}.sub a:hover,.sub a:focus-visible{background:var(--panel)}.sub a small{display:block;color:#5d666c;font-size:13px}
nav a:hover,nav a:focus-visible{background:var(--g2);color:#fff}
nav a[aria-current=page]{background:var(--g2);color:#fff;box-shadow:inset 0 -3px 0 var(--lime)}
.cartbtn{margin-left:auto;background:var(--lime);color:#072a20;border:0;border-radius:6px;padding:10px 14px;font:600 15px Inter,sans-serif;cursor:pointer;min-height:44px;white-space:nowrap}
.cartbtn b{background:#072a20;color:var(--lime);border-radius:20px;padding:0 7px;margin-left:6px}
.hero{background:var(--g);color:#fff;padding-bottom:0}
.hero p{color:#cfe1d8;max-width:62ch;font-size:17px;margin:14px 0 22px}
.hero h1{font-size:clamp(28px,4vw,44px);max-width:24ch}
.hero .hsub{color:var(--lime);font:600 clamp(17px,1.8vw,21px)/1.35 Inter,sans-serif;max-width:60ch;margin:14px 0 26px}
.herogrid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stats div{font-size:14px;color:#cfe1d8}.stats b{display:block;font:800 30px Archivo,sans-serif;color:#fff}
.slides{position:relative;margin-top:26px;height:clamp(200px,28vw,340px);background:#fff;border-radius:14px 14px 0 0;overflow:hidden}
.sl{position:absolute;inset:0;opacity:0;transition:opacity .8s ease;display:flex;align-items:center;justify-content:center;padding:18px 24px 64px}
.sl.on{opacity:1;z-index:1}
.sl img{max-width:100%;max-height:100%;object-fit:contain}
.sl img.z{height:88%;max-height:none}
.sl.cx{padding:0;display:grid;grid-template-columns:3fr 2fr;align-items:stretch}
.slx{position:relative;overflow:hidden}.slx img{width:100%;height:100%;max-height:none;object-fit:cover}
.slt{position:absolute;left:16px;top:16px;max-width:80%;background:rgba(6,34,25,.86);color:#fff;font:700 clamp(16px,2vw,24px)/1.2 Archivo,sans-serif;padding:10px 14px;border-radius:8px}
.slp{position:relative;background:#f8f8fa}.slp img{position:absolute;left:16px;top:16px;width:calc(100% - 32px);height:calc(100% - 64px);max-height:none;object-fit:contain}
@media(max-width:720px){.sl.cx{grid-template-columns:1fr 1fr}.slt{font-size:14px;left:8px;top:8px}}
.slc{position:absolute;left:16px;bottom:14px;z-index:2;display:flex;gap:10px;align-items:center;background:rgba(6,34,25,.86);color:#fff;border-radius:8px;padding:8px 12px;font-size:14px;max-width:calc(100% - 32px)}
.slc b{font-weight:700}.slc span{color:#cfe1d8}
.slc button{background:var(--lime);color:var(--g);border:0;border-radius:6px;font:600 13px inherit;padding:6px 10px;cursor:pointer;min-height:32px;white-space:nowrap}
.sld{position:absolute;right:14px;bottom:20px;z-index:2;display:flex;gap:6px}
.sld button{width:10px;height:10px;border-radius:50%;border:1px solid var(--g);background:#fff;padding:0;cursor:pointer}
.sld button[aria-current]{background:var(--g)}
@media(max-width:720px){.sld{display:none}.slc span{display:none}}
@media(prefers-reduced-motion:reduce){.sl{transition:none}}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid #1d5a47}
.tiles a{padding:18px 20px;text-decoration:none;color:#fff;border-right:1px solid #1d5a47}
.tiles a:last-child{border-right:0}.tiles a:hover{background:var(--g2)}
.tiles b{font:700 18px Archivo,sans-serif;display:block}.tiles span{font-size:14px;color:#b9d2c6}
.view{display:none}.view.on{display:block}
.cat{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;align-items:start}
.rail{position:sticky;top:130px;display:grid;gap:18px}
.rail h4{margin:0 0 6px;font-size:14px;color:var(--mut);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:8px 12px;font:14px Inter,sans-serif;cursor:pointer;min-height:38px}
.chip[aria-pressed=true]{background:var(--btn);color:#fff;border-color:var(--btn)}
input,select,textarea{font:16px Inter,sans-serif;color:var(--ink);background:var(--bg);border:1px solid color-mix(in srgb,var(--ink) 30%,transparent);border-radius:6px;padding:10px 12px;width:100%;min-height:44px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #3fae86;outline-offset:2px}
.count{color:var(--mut);font-size:15px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.thumb{background:var(--panel);height:130px;display:grid;place-items:center;cursor:pointer;border:0;width:100%;padding:0}
.thumb svg{width:82%;height:110px}
.thumb.ph{background:#fff}
.thumb img{max-width:92%;max-height:118px;object-fit:contain}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.mk{font-size:13px;color:var(--mut)}
.card h3{font-size:21px}
.card ul{margin:2px 0 8px;padding-left:18px;font-size:14px;color:var(--mut)}
.row{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--btn);background:var(--btn);color:#fff;border-radius:6px;padding:10px 14px;font:600 15px Inter,sans-serif;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border-color:color-mix(in srgb,var(--ink) 35%,transparent)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:#072a20}
.btn:disabled{opacity:.5;cursor:default}
.price{font-weight:700;white-space:nowrap}
.price small{font-weight:400;color:var(--mut)}
.lock{border:1px dashed color-mix(in srgb,var(--ink) 35%,transparent);background:none;color:var(--ink);border-radius:6px;padding:8px 10px;font:14px Inter,sans-serif;cursor:pointer;min-height:40px}
.empty{padding:40px;text-align:center;border:1px dashed var(--line);border-radius:10px;color:var(--mut)}
.alt{background:var(--panel)}
.note{font-size:14px;color:var(--mut)}
.tag{display:inline-block;border-radius:4px;padding:2px 8px;font-size:13px;font-weight:600;background:var(--panel);border:1px solid var(--line)}
.tag.auc{background:#fef3c7;color:#78350f;border-color:#fcd34d}
.tag.fix{background:#dcfce7;color:#14532d;border-color:#86efac}
.list{border-top:1px solid var(--line)}
.li{display:grid;grid-template-columns:110px minmax(0,1fr) 170px 200px;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.li .ic{background:var(--panel);border-radius:8px;height:72px;display:grid;place-items:center}
.li .ic svg{width:90%;height:64px}
.li h3{font-size:18px;margin-bottom:4px}
.li dl{display:flex;flex-wrap:wrap;gap:2px 16px;margin:0;font-size:14px;color:var(--mut)}
.li dt{display:inline}.li dd{display:inline;margin:0 0 0 4px;color:var(--ink)}
.li .act{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.li .act input{width:64px;padding:8px}
.rail2{top:130px;max-height:calc(100vh - 150px);overflow:auto;padding-right:6px}
.fsum{font:700 16px Archivo,sans-serif;cursor:pointer;padding:8px 0;list-style:none}
.fac{border-top:1px solid var(--line);padding:6px 0}
.fac summary{cursor:pointer;font-weight:600;font-size:15px;padding:8px 0;min-height:36px}
.fn{background:var(--btn);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-left:4px}
.fv{display:grid;gap:2px;padding-bottom:6px}
.fo{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px;padding:3px 0;cursor:pointer}
.fo input{width:18px;min-height:18px;margin:0}
.fo small{color:var(--mut);font-variant-numeric:tabular-nums}
.fo:has(input:disabled){opacity:.45}
.lnk{background:none;border:0;color:var(--btn);font:600 14px Inter,sans-serif;cursor:pointer;padding:6px 0;text-align:left}
.tf{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;background:var(--bg);overflow:hidden}
.tfh{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 16px}
.tfi{background:#fff;border-radius:8px;height:90px;display:grid;place-items:center;overflow:hidden}
.tfi img{max-width:100%;max-height:86px;object-fit:contain}.tfi svg{width:90%;height:70px}
.tfh h3{font-size:18px;margin:2px 0 6px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:0}
.sk{display:block;max-width:min(420px,90%);margin:4px 16px 6px;background:#fff;border-radius:6px}
.vt{font-size:14px;min-width:560px}.vt th{width:auto;white-space:nowrap}.vt td,.vt th{padding:6px 8px}
.vt .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.vt .cd{font-weight:600;white-space:nowrap}
.vt .ac{display:flex;gap:6px;justify-content:flex-end}.vt .ac input{width:60px;min-height:36px;padding:6px}.vt .ac .btn{min-height:36px;padding:6px 12px}
.tf .scroll{border-top:1px solid var(--line);max-height:420px;overflow:auto}
@media(max-width:900px){.rail2{max-height:none}.tfh{grid-template-columns:80px minmax(0,1fr)}.tfh .btn{grid-column:1/-1}}
.used{display:grid;gap:20px;margin-top:22px}
.um{border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:340px minmax(0,1fr);overflow:hidden;background:var(--bg)}
.um .thumb{height:100%;min-height:180px;cursor:default}
.um .cb{padding:20px}
.ug{position:relative;align-content:start;background:#fff}.ug>img{width:100%;height:100%;max-height:360px;object-fit:contain}
.pg{height:300px;cursor:default;background:#fff}.pg img{max-height:290px!important;object-fit:contain}
.dh{font:700 16px Archivo,sans-serif;margin:18px 0 6px}.vtw{overflow-x:auto}.vt{border-collapse:collapse;font-size:13px;min-width:640px}.vt th,.vt td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}.vt th{font-weight:600;background:var(--panel)}
.uth{display:flex;gap:6px;padding:8px;flex-wrap:wrap;justify-content:center}.uth button{border:1px solid var(--line);padding:0;border-radius:4px;background:#fff;cursor:pointer;width:52px;height:40px;overflow:hidden}.uth button[aria-current]{outline:2px solid var(--lime);border-color:var(--g)}.uth img{width:100%;height:100%;object-fit:cover}
.um dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 18px;margin:8px 0 12px}
.um dt{font-size:13px;color:var(--mut)}.um dd{margin:0;font-weight:600}
.lots{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:22px}
.lot{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:10px}
.lot .now{font:800 30px Archivo,sans-serif;white-space:nowrap}
.timer{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.timer.end{color:var(--warn)}
.bidrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.hist{font-size:14px;color:var(--mut);margin:0;padding:0;list-style:none;max-height:96px;overflow:auto}
.hist li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:4px 0}
.msg{font-size:14px;min-height:20px;margin:0}
.msg.err{color:var(--warn)}.msg.ok{color:light-dark(#166534,#5fd38e)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:22px}
.three p{margin:8px 0 0;color:var(--mut)}
.form{display:grid;gap:12px}
.form label{font-size:14px;font-weight:600;display:grid;gap:4px}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.chk{display:flex!important;gap:8px;align-items:center;font-weight:400!important}
.chk input{width:20px;min-height:20px}
dialog{border:0;border-radius:12px;padding:0;max-width:min(720px,94vw);width:100%;background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,20,15,.6)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:12px}
.db{padding:18px 20px;max-height:72vh;overflow:auto}
.x{background:none;border:0;font-size:28px;color:var(--ink);cursor:pointer;width:44px;height:44px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;width:42%}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto 72px auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}
.tot{display:flex;justify-content:space-between;font-weight:700;padding:10px 0}
.tabs{display:flex;gap:6px;margin-bottom:14px}
footer{background:var(--g);color:#cfe1d8;font-size:15px}
footer b{color:#fff}
@media(max-width:1000px){.li{grid-template-columns:90px minmax(0,1fr);}.li .pr,.li .act{grid-column:2}.li .act{justify-content:flex-start}}
@media(max-width:900px){.cat{grid-template-columns:minmax(0,1fr)}.rail{position:static}.three{grid-template-columns:minmax(0,1fr)}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles a:nth-child(2){border-right:0}}
@media(max-width:720px){.herogrid,.two,.um{grid-template-columns:minmax(0,1fr)}.um .thumb{min-height:130px}}
@media(max-width:1180px){nav{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;border-top:1px solid rgba(255,255,255,.12);padding-top:6px}}
@media(max-width:600px){nav a{padding:8px}.f2{grid-template-columns:minmax(0,1fr)}.li{grid-template-columns:70px minmax(0,1fr)}.li .ic{height:56px}.ci{grid-template-columns:minmax(0,1fr) 64px auto}.ci .price{grid-column:1}}
@media(prefers-reduced-motion:reduce){.spin{animation:none!important}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 1.4s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="test" data-t="testBar"></div>
<div class="top"><div class="wrap">
<div class="langs" id="langs" aria-label="Jezik"></div>
<div class="acct" id="acct"></div>
</div></div>
<header><div class="hd">
<a class="logo" href="#stroji"><img src="img/logo-white.png" alt="TEKSTURA d.o.o." height="34" style="display:block;height:34px;width:auto"></a>
<nav id="nav"></nav><div class="sub" id="subNew" role="menu"></div>
<button class="cartbtn" id="openCart" type="button"><span data-t="cart"></span><b id="cartN">0</b></button>
</div></header>

<div class="view" id="stroji">
<section class="band hero"><div class="wrap">
<div class="herogrid">
<div><h1 data-t="heroT"></h1><p class="hsub" data-t="heroS"></p><button class="btn lime" type="button" id="toCat" data-t="heroB"></button></div>
<div class="stats" id="stats"></div>
</div>
<div class="slides" id="slides" aria-roledescription="carousel" aria-label="FOM Industrie, iVision Vacuum"></div>
</div>
<div class="tiles wrap" id="tiles"></div>
</section>
<section class="band" id="katalog"><div class="wrap">
<h2 data-t="newT"></h2><p class="note" style="margin:8px 0 24px" data-t="newP"></p>
<div class="cat">
<aside class="rail">
<label><h4 data-t="search"></h4><input id="q" type="search"></label>
<div><h4 data-t="mkType"></h4><div class="chips bch" id="fBrand"></div></div>
<div><h4 data-t="group"></h4><div class="chips" id="fCat"></div></div>
<button class="btn ghost" id="reset" type="button" data-t="reset"></button>
</aside>
<div><p class="count" id="count"></p><div class="grid" id="grid"></div></div>
</div>
</div></section>
</div>

<div class="view" id="rabljeni"><section class="band"><div class="wrap">
<h2 data-t="usedT"></h2><p class="note" style="margin:8px 0 0" data-t="usedP"></p>
<div class="used" id="used"></div>
</div></section></div>

<div class="view" id="drazbe"><section class="band alt"><div class="wrap">
<h2 data-t="aucT"></h2><p class="note" style="margin:8px 0 0" data-t="aucP"></p>
<div style="margin-top:12px"><button class="btn ghost" id="resetAuc" type="button" data-t="aucReset"></button></div>
<div class="lots" id="lots"></div>
</div></section></div>

<div class="view" id="orodja"><section class="band"><div class="wrap">

const tv=x=>LI[lang]<0?x:(VAL[x]?.[LI[lang]]||x);
let fsel={},ftq='',fopen={},fmore={};
const famVals=(f,k)=>{const x=k==='m'?f.m:f[k];return x==null||x===''?[]:Array.isArray(x)?x:[x]};
function vPass(f,v,skip){for(const [k,lvl] of FACETS){if(k===skip||lvl!=='v'||!fsel[k]?.size)continue;const x=v.a[k];if(x==null||!fsel[k].has(String(x)))return false}return true}
function fPass(f,skip){for(const [k,lvl] of FACETS){if(k===skip||lvl!=='f'||!fsel[k]?.size)continue;if(!famVals(f,k).some(x=>fsel[k].has(String(x))))return false}
 if(ftq){const q=ftq.toLowerCase();if(!(fName(f)+' '+f.id+' '+f.m+' '+f.v.map(v=>v.c).join(' ')).toLowerCase().includes(q))return false}return true}
function matching(skip){return TF.map(f=>fPass(f,skip)?{f,vs:f.v.filter(v=>vPass(f,v,skip)&&(!ftq||!/[\d.]/.test(ftq)||(fName(f)+' '+f.id).toLowerCase().includes(ftq.toLowerCase())||v.c.toLowerCase().includes(ftq.toLowerCase())))}:null).filter(x=>x&&x.vs.length)}
const sortV=a=>a.sort((x,y)=>{const p=parseFloat(x),q=parseFloat(y);return isNaN(p)||isNaN(q)?String(x).localeCompare(String(y),'sl'):p-q});
function renderFacets(){let h='';
 for(const [k,lvl,lab] of FACETS){const cnt={};for(const {f,vs} of matching(k)){if(lvl==='f')famVals(f,k).forEach(x=>cnt[x]=(cnt[x]||0)+vs.length);else vs.forEach(v=>{const x=v.a[k];if(x!=null)cnt[x]=(cnt[x]||0)+1})}
  (fsel[k]||[]).forEach(x=>{if(!(x in cnt))cnt[x]=0});
  const vals=sortV(Object.keys(cnt));if(!vals.length)continue;
  const open=fopen[k]??(['m','cat','obd','premer'].includes(k)||fsel[k]?.size>0),many=vals.length>12&&!fmore[k];
  h+='<details class="fac"'+(open?' open':'')+' data-fk="'+k+'"><summary>'+t(lab)+(fsel[k]?.size?' <b class="fn">'+fsel[k].size+'</b>':'')+'</summary><div class="fv">'+(many?vals.slice(0,12):vals).map(x=>'<label class="fo"><input type="checkbox" data-fk="'+k+'" value="'+esc(x)+'"'+(fsel[k]?.has(String(x))?' checked':'')+(cnt[x]?'':' disabled')+'><span>'+esc(lvl==='v'?x:tv(x))+'</span><small>'+cnt[x]+'</small></label>').join('')+(many?'<button type="button" class="lnk" data-more="'+k+'">'+t('showAll')+' ('+vals.length+')</button>':'')+'</div></details>'}
 $('fac').innerHTML=h}
function renderTools(){TF.forEach(f=>f.n=fName(f));if(tLoad!=='ok'){$('fac').innerHTML='';$('selF').innerHTML='';$('tCount').textContent='';$('tList').innerHTML='<div class="empty">'+(tLoad==='load'?t('loading'):t('loadErr'))+'</div>';return}renderFacets();const R=matching(null);const nv=R.reduce((a,x)=>a+x.vs.length,0);
 const chips=Object.entries(fsel).flatMap(([k,s])=>[...s].map(x=>'<button type="button" class="chip" aria-pressed="true" data-rmf="'+k+'|'+esc(x)+'">'+esc(t(FACETS.find(f=>f[0]===k)[2]))+': '+esc(tv(x))+' ×</button>'));
 $('selF').innerHTML=chips.length?chips.join('')+'<button type="button" class="lnk" id="clrF">'+t('reset')+'</button>':'';
 $('tCount').textContent=R.length+' '+t('families')+' · '+nv+' '+t('variants');
 $('tList').innerHTML=R.length?R.map(({f,vs})=>{const op=fopen['#'+f.id];return '<article class="tf"><div class="tfh"><div class="tfi">'+(f.slika?'<img src="'+esc(f.slika)+'" alt="" loading="lazy">':svg(f.cat==='Potrošni material'?'eq':'tool'))+'</div><div><div class="mk">'+B[f.m]+' · '+esc(tv(f.cat))+' · '+t('code')+' '+esc(f.id)+'</div><h3>'+esc(f.n)+'</h3>'+(fOpis(f)?'<p class="note" style="margin:0 0 6px">'+esc(fOpis(f))+'</p>':'')+'<dl class="tags">'+[...f.obd,...f.tip].map(x=>'<span class="tag">'+esc(tv(x))+'</span>').join('')+'</dl>'+(lang!=='sl'?'':'')+'</div><button type="button" class="btn ghost" data-tog="'+f.id+'" aria-expanded="'+!!op+'">'+vs.length+' '+t('variants')+(vs.length<f.v.length?' / '+f.v.length:'')+(op?' ▴':' ▾')+'</button></div>'+(op?varTable(f,vs):'')+'</article>'}).join(''):'<div class="empty">'+t('none')+'</div>'}
function varTable(f,vs){const cols=f.cols;return (f.skica?'<img class="sk" src="'+esc(f.skica)+'" alt="">':'')+'<div class="scroll"><table class="vt"><thead><tr><th>'+t('code')+'</th>'+cols.map(c=>'<th class="n">'+esc(f.colL?.[c]||COLL[c]||c)+'</th>').join('')+'<th>'+t('priceH')+'</th><th></th></tr></thead><tbody>'+vs.map(v=>'<tr><td class="cd">'+esc(v.c)+'</td>'+cols.map(c=>'<td class="n">'+esc(v.a[c]??'')+'</td>').join('')+'<td>'+priceHtml(v.pr,v.sp)+'</td><td class="ac">'+(v.k?'<input type="number" min="1" value="1" aria-label="'+t('qty')+'" data-vq="'+esc(v.c)+'"><button class="btn" type="button" data-vadd="'+esc(v.c)+'">'+(cart[v.c]?'✓':'+')+'</button>':'')+'</td></tr>').join('')+'</tbody></table></div>'}
$('fac').addEventListener('change',e=>{const c=e.target.closest('input[data-fk]');if(!c)return;const k=c.dataset.fk;(fsel[k]??=new Set());c.checked?fsel[k].add(c.value):fsel[k].delete(c.value);if(!fsel[k].size)delete fsel[k];renderTools()});
$('fac').addEventListener('toggle',e=>{const d=e.target.closest('details[data-fk]');if(d)fopen[d.dataset.fk]=d.open},true);
$('fac').addEventListener('click',e=>{const b=e.target.closest('[data-more]');if(b){fmore[b.dataset.more]=1;renderFacets()}});
$('selF').addEventListener('click',e=>{const b=e.target.closest('[data-rmf]');if(b){const [k,x]=b.dataset.rmf.split('|');fsel[k]?.delete(x);if(!fsel[k]?.size)delete fsel[k];renderTools()}if(e.target.id==='clrF'){fsel={};renderTools()}});
$('tq').addEventListener('input',e=>{ftq=e.target.value.trim();renderTools()});
$('tList').addEventListener('click',e=>{const g=e.target.closest('[data-tog]');if(g){fopen['#'+g.dataset.tog]=!fopen['#'+g.dataset.tog];renderTools();return}
 const b=e.target.closest('[data-vadd]');if(b){const c=b.dataset.vadd,q=Math.max(1,parseInt(document.querySelector('[data-vq="'+CSS.escape(c)+'"]').value)||1);cart[c]=(cart[c]||0)+q;saveCart();renderTools()}});

try{if(matchMedia('(max-width:900px)').matches)$('facBox').open=false}catch(e){}

/* ── Cart / inquiry ── */
function saveCart(){ls.set('tk_cart2',cart);$('cartN').textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function add(id){cart[id]=(cart[id]||0)+1;saveCart();renderP();renderUsed();renderLots()}
document.addEventListener('click',e=>{const o=e.target.closest('[data-open]'),a=e.target.closest('[data-add]');if(o)openP(o.dataset.open);if(a)add(a.dataset.add);if(e.target.closest('[data-login]'))openLogin();if(e.target.closest('[data-reg]'))openReg();if(e.target.id==='logout'){user=null;ls.set('tk_user',null);renderAll()}});
function openCart(){const ids=Object.keys(cart).filter(itemInfo);let sum=0;
$('cBody').innerHTML=(ids.length?ids.map(id=>{const p=itemInfo(id);if(user&&p.sp&&p.pr)sum+=p.pr*cart[id];return '<div class="ci"><div><b>'+esc(p.n)+'</b><div class="mk">'+esc(p.m)+'</div></div><div>'+priceHtml(p.pr,p.sp)+'</div><input type="number" min="1" max="999" value="'+cart[id]+'" data-q="'+id+'" aria-label="'+t('qty')+'"><button class="btn ghost" type="button" data-rm="'+id+'">'+t('remove')+'</button></div>'}).join('')+(sum?'<div class="tot"><span>'+t('total')+'</span><span class="price">'+fmt(sum)+' <small>'+t('vat')+'</small></span></div>':''):'<div class="empty">'+t('cartEmpty')+'</div>')+
'<form class="form" id="inqForm" novalidate style="margin-top:18px">'+(user?'':'<p class="note">'+t('guestNote')+' <button type="button" class="lock" data-login>'+t('login')+'</button></p><div class="f2"><label>'+t('name')+'<input id="iName" autocomplete="name"></label><label>'+t('company')+'<input id="iCo" autocomplete="organization"></label></div><div class="f2"><label>'+t('email')+'<input id="iMail" type="email" autocomplete="email"></label><label>'+t('phone')+'<input id="iTel" type="tel"></label></div>')+'<label>'+t('msgL')+'<textarea id="iMsg" rows="3"></textarea></label><button class="btn" type="submit"'+(ids.length?'':' disabled')+'>'+t('send')+'</button><p class="msg" id="iOut"></p></form>';
if(!$('dlgC').open)$('dlgC').showModal()}
$('openCart').addEventListener('click',openCart);
$('cBody').addEventListener('change',e=>{const q=e.target.dataset.q;if(q){cart[q]=Math.max(1,Math.min(999,parseInt(e.target.value)||1));saveCart();openCart()}});
$('cBody').addEventListener('click',e=>{const r=e.target.closest('[data-rm]');if(r){delete cart[r.dataset.rm];saveCart();renderAll();openCart()}});
const okMail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
$('cBody').addEventListener('submit',e=>{e.preventDefault();const o=$('iOut');if(!user&&(!$('iName').value.trim()||!okMail($('iMail').value.trim()))){o.className='msg err';o.textContent=t('sendErr');return}cart={};saveCart();renderAll();o.className='msg ok';o.textContent=t('sendOk')});

$('partForm').addEventListener('submit',e=>{e.preventDefault();const o=$('pOut');if(!($('pModel').value.trim()||$('pSer').value.trim())||!$('pDesc').value.trim()||!okMail($('pMail').value.trim())){o.className='msg err';o.textContent=t('pErr');return}o.className='msg ok';o.textContent=t('pOk')+($('pPhoto').files.length?' ('+$('pPhoto').files.length+' foto)':'');e.target.reset();if(user)$('pMail').value=user.email});

/* ── Auctions (test) ── */
function initAuc(force){let a=ls.get('tk_auc2',null);if(!a||force){const now=Date.now();a={};LOTS.forEach(([id,,s,,h])=>a[id]={p:s,end:now+h*3600e3,h:[]});ls.set('tk_auc2',a)}return a}
let A=initAuc(false);
const lotName=l=>l[1]||'';
function left(ms){if(ms<=0)return t('ended');const s=Math.floor(ms/1e3),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;return (d?d+' d ':'')+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function renderLots(){const dbl=U.filter(u=>u.nacin==='drazba').map(u=>{const sl=u.slike||[],now=Date.now(),z=u.drazba_zacetek?Date.parse(u.drazba_zacetek):0,k=u.drazba_konec?Date.parse(u.drazba_konec):0;
 return '<article class="lot">'+(sl[0]?'<img src="'+esc(sl[0])+'" alt="" style="height:160px;width:100%;object-fit:cover;border-radius:8px;background:var(--panel)">':'<svg viewBox="0 0 200 90" style="height:90px;background:var(--panel);border-radius:8px" aria-hidden="true">'+ICON.cnc+'</svg>')+'<h3>'+esc(uName(u))+'</h3><div class="mk">'+esc(u.proizvajalec||'')+(u.leto?' · '+t('year')+' '+u.leto:'')+'</div>'+
 '<div class="mk">'+(z?t('aucFrom')+' '+dt(u.drazba_zacetek):'')+(k?' – '+dt(u.drazba_konec):'')+'</div>'+(u.ima_rezervo?'<div class="mk">'+t('hasRes')+'</div>':'')+
 '<p class="note" style="margin:0">'+(k&&k<now?t('ended'):t('aucSoon'))+'</p><div class="row" style="margin:0"><a class="btn ghost" href="#rabljeni" style="text-decoration:none">'+t('details')+'</a><button class="btn" type="button" data-add="'+u.id+'">'+(cart[u.id]?t('added'):t('add'))+'</button></div></article>'}).join('');
 $('lots').innerHTML=dbl+LOTS.map(l=>{const [id,,,inc,,res]=l,a=A[id],over=a.end<=Date.now(),min=a.p+inc,met=!res||(a.h.length&&a.p>=res);
return '<article class="lot"><svg viewBox="0 0 200 90" style="height:90px;background:var(--panel);border-radius:8px" aria-hidden="true">'+ICON[id==='x1'?'vac':'tool']+'</svg><h3>'+esc(lotName(l))+'</h3><div class="row" style="justify-content:space-between;align-items:end;margin:0"><div><div class="mk">'+(a.h.length?t('cur'):t('start'))+'</div><div class="now">'+(user?fmt(a.p):'••••')+'</div></div><div style="text-align:right"><div class="mk">'+t('left')+'</div><div class="timer'+(over?' end':'')+'" data-tm="'+id+'">'+left(a.end-Date.now())+'</div></div></div>'+
(user?'<div class="mk">'+t('step')+' '+fmt(inc)+' · '+a.h.length+' '+t('bids')+'</div>'+(res?'<div class="mk" style="color:'+(met?'light-dark(#166534,#5fd38e)':'var(--warn)')+'">'+(met?t('resOk'):t('resNo'))+'</div>':'')+'<div class="bidrow"><input type="number" inputmode="numeric" min="'+min+'" step="'+inc+'" value="'+min+'" aria-label="'+t('yourBid')+'" '+(over?'disabled':'')+'><button class="btn" type="button" data-bid="'+id+'" '+(over?'disabled':'')+'>'+t('bid')+'</button></div><p class="msg" data-m="'+id+'">'+(over?(a.h.length?(met?t('winner')+' '+fmt(a.h[0].v):t('endNoRes')):t('noBids')):'')+'</p><ul class="hist">'+a.h.map(b=>'<li><span>'+esc(b.who)+'</span><span>'+fmt(b.v)+'</span></li>').join('')+'</ul>':'<button type="button" class="lock" data-login>'+t('loginBid')+'</button>')+'</article>'}).join('')}
$('lots').addEventListener('click',e=>{const b=e.target.closest('[data-bid]');if(!b||!user)return;const id=b.dataset.bid,l=LOTS.find(x=>x[0]===id),a=A[id],v=parseFloat(b.previousElementSibling.value);const m=document.querySelector('[data-m="'+id+'"]');
if(a.end<=Date.now()){renderLots();return}if(!(v>=a.p+l[3])){m.className='msg err';m.textContent=t('minBid')+' '+fmt(a.p+l[3])+'.';return}
a.p=v;a.h.unshift({who:user.co,v});if(a.end-Date.now()<120e3)a.end=Date.now()+120e3;ls.set('tk_auc2',A);renderLots();const m2=document.querySelector('[data-m="'+id+'"]');m2.className='msg ok';m2.textContent=t('yourBid')+' '+fmt(v)+' '+t('top')});
$('resetAuc').addEventListener('click',()=>{A=initAuc(true);renderLots()});
setInterval(()=>{let end=false;document.querySelectorAll('[data-tm]').forEach(x=>{const a=A[x.dataset.tm],ms=a.end-Date.now();if(ms<=0&&!x.classList.contains('end'))end=true;x.textContent=left(ms)});if(end)renderLots()},1000);

/* ── Router ── */
const VIEWS=['stroji','rabljeni','drazbe','orodja','deli','podjetje'];
function markNav(){const h0=location.hash.slice(1).split('/')[0],v=VIEWS.includes(h0)?h0:'stroji';document.querySelectorAll('#nav a').forEach(a=>{if(a.getAttribute('href')==='#'+v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')})}
function route(){const [h,sub]=location.hash.slice(1).split('/'),v=VIEWS.includes(h)?h:'stroji';VIEWS.forEach(x=>$(x).classList.toggle('on',x===v));markNav();closeSub();
 if(v==='stroji'&&(sub==='fom'||sub==='iv')){st={brand:sub==='fom'?'FOM':'IV',cat:'',q:''};$('q').value='';renderF();renderP();requestAnimationFrame(()=>$('katalog').scrollIntoView())}else window.scrollTo(0,0)}
let subT=null;
function openSub(){const w=$('nvNew'),m=$('subNew');if(!w)return;clearTimeout(subT);const r=w.getBoundingClientRect();m.style.top=(r.bottom+4)+'px';m.style.left=Math.max(8,Math.min(r.left,innerWidth-m.offsetWidth-8||r.left))+'px';m.classList.add('on');$('nvT').setAttribute('aria-expanded','true');requestAnimationFrame(()=>{m.style.left=Math.max(8,Math.min(r.left,innerWidth-m.offsetWidth-8))+'px'})}
function closeSub(){const m=$('subNew');if(!m)return;m.classList.remove('on');$('nvT')?.setAttribute('aria-expanded','false')}
function laterClose(){clearTimeout(subT);subT=setTimeout(closeSub,250)}
document.addEventListener('click',e=>{if(e.target.closest('#nvT')){$('subNew').classList.contains('on')?closeSub():openSub();return}if(!e.target.closest('#subNew'))closeSub()});
document.addEventListener('mouseover',e=>{if(e.target.closest('#nvNew')||e.target.closest('#subNew')){if(matchMedia('(hover:hover)').matches)openSub()}else if($('subNew').classList.contains('on'))laterClose()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('subNew').classList.contains('on')){closeSub();$('nvT').focus()}});
window.addEventListener('scroll',closeSub,{passive:true});$('nav').addEventListener('scroll',closeSub,{passive:true});
window.addEventListener('hashchange',route);
$('toCat').addEventListener('click',()=>$('katalog').scrollIntoView());
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));

function renderAll(){applyText();renderF();renderP();renderUsed();renderTools();renderLots();renderSlides();saveCart();if($('dlgC').open)openCart()}
renderAll();route();naloziKatalog();naloziRabljene();renderSlides();startSlides();
{const sl=$('slides');if(sl){sl.addEventListener('mouseenter',()=>clearInterval(slT));sl.addEventListener('mouseleave',startSlides);sl.addEventListener('focusin',()=>clearInterval(slT));sl.addEventListener('focusout',startSlides)}}
}
